{% extends "base.html" %}
{% block title %}Leave types · Leave Manager{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Leave types</h1><p>Changing a quota also updates everyone's balance total for this year.</p></div></div>
<div class="row g-3">
  <div class="col-lg-7"><div class="panel">
    <table class="table">
      <thead><tr><th>Name</th><th>Yearly quota (days)</th></tr></thead>
      <tbody>{% for t in rows %}
        <tr><td>{{ t.name }}</td><td>
          <form class="d-flex gap-2" method="post" action="{{ url_for('leave_type_quota', lid=t.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input class="form-control form-control-sm" style="max-width: 100px" type="number" min="0" name="yearly_quota" value="{{ t.yearly_quota }}" aria-label="Yearly quota for {{ t.name }}">
            <button class="btn btn-sm btn-outline-primary">Save</button></form></td></tr>
      {% endfor %}</tbody>
    </table>
  </div></div>
  <div class="col-lg-5"><form class="panel" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h2>Add a leave type</h2>
    <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" required></div>
    <div class="mb-3"><label class="form-label" for="yearly_quota">Yearly quota (days)</label><input class="form-control" type="number" min="0" id="yearly_quota" name="yearly_quota" required></div>
    <button class="btn btn-primary">Add leave type</button>
  </form></div>
</div>
{% endblock %}
